name: VS Code extension

on:
  push:
    branches: [ main ]
    paths: [ 'editors/vscode/**', '.github/workflows/vscode-extension.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'editors/vscode/**', '.github/workflows/vscode-extension.yml' ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Bundle
        run: node esbuild.js --production

      - name: Package .vsix
        run: npx vsce package --no-dependencies --allow-missing-repository

      - uses: actions/upload-artifact@v4
        with:
          name: nova-lang-vsix
          path: editors/vscode/*.vsix
